[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-harness"
version = "0.1.0"
description = "Stack-independent two-developer hackathon orchestrator"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
contracts = ["openapi-spec-validator>=0.9,<0.10"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
