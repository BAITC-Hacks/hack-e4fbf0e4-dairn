name: ekt

x-runtime: &runtime
  restart: unless-stopped
  init: true
  networks: [ekt]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-assistant-environment: &assistant-environment
  ASSISTANT_ENVIRONMENT: production
  ASSISTANT_ALLOW_DEMO_SESSIONS: "false"
  ASSISTANT_DATA_DIR: /data
  ASSISTANT_POLICY_FILE: /config/policies.json
  ASSISTANT_CATALOG_MODE: http
  ASSISTANT_CATALOG_BASE_URL: http://ekt-catalog-service:8080
  ASSISTANT_CATALOG_MOCK_ON_UNAVAILABLE: "false"
  ASSISTANT_CATALOG_TIMEOUT_SECONDS: ${ASSISTANT_CATALOG_TIMEOUT_SECONDS:-30}
  ASSISTANT_CART_MODE: disabled
  ASSISTANT_FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
  ASSISTANT_CORS_ORIGINS: '["${PUBLIC_FRONTEND_URL:-http://localhost:5173}"]'
  ASSISTANT_BOOTSTRAP_TOKEN: ${ASSISTANT_BOOTSTRAP_TOKEN:-}
  ASSISTANT_AUTH_TOKEN_TTL_SECONDS: ${ASSISTANT_AUTH_TOKEN_TTL_SECONDS:-86400}
  ASSISTANT_USER_HISTORY_TTL_DAYS: ${ASSISTANT_USER_HISTORY_TTL_DAYS:-30}
  ASSISTANT_MODEL_API_KEY: ${ASSISTANT_MODEL_API_KEY:-}
  ASSISTANT_MODEL_NAME: ${ASSISTANT_MODEL_NAME:-}

services:
  frontend:
    <<: *runtime
    build:
      context: ./frontend-service
      target: production
      args:
        VITE_ASSISTANT_API_URL: /assistant
        VITE_CERTIFICATE_ORIGINS: ${VITE_CERTIFICATE_ORIGINS:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      assistant-service:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  ekt-catalog-service:
    <<: *runtime
    build: ./ekt-catalog-service
    environment:
      CATALOG_HOST: 0.0.0.0
      PORT: "8080"
      CATALOG_SOURCE: live
      EKT_API_BASE_URL: ${EKT_API_BASE_URL:-https://ekt.kz}
      EKT_API_USERNAME: ${EKT_API_USERNAME:?Set EKT_API_USERNAME in the root .env}
      EKT_API_PASSWORD: ${EKT_API_PASSWORD:?Set EKT_API_PASSWORD in the root .env}
      CATALOG_CORS_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      CATALOG_MAX_PRODUCTS: ${CATALOG_MAX_PRODUCTS:-100}
      CATALOG_MAX_PAGES: ${CATALOG_MAX_PAGES:-10}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
      CATALOG_LOAD_TIMEOUT_MS: ${CATALOG_LOAD_TIMEOUT_MS:-25000}
      OPENAI_PREVALIDATION_ENABLED: ${OPENAI_PREVALIDATION_ENABLED:-false}
      OPENAI_SEARCH_ENABLED: ${OPENAI_SEARCH_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-20000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${CATALOG_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:8080/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  assistant-service:
    <<: *runtime
    image: ekt-assistant:${IMAGE_TAG:-local}
    build: ./assistant-service
    environment: *assistant-environment
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ASSISTANT_PORT:-8000}:8000"
    volumes: &assistant-volumes
      - assistant-data:/data
      - ./assistant-service/config:/config:ro
    depends_on:
      ekt-catalog-service:
        condition: service_healthy

  assistant-worker:
    <<: *runtime
    image: ekt-assistant:${IMAGE_TAG:-local}
    build: ./assistant-service
    command: [python, -m, app.worker]
    environment: *assistant-environment
    volumes: *assistant-volumes
    depends_on:
      assistant-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/data/worker.heartbeat')<30"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  ekt:
    driver: bridge

volumes:
  assistant-data:
