[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekt-assistant-service"
version = "0.2.0"
description = "EKT AI assistant, session and confirmed-cart orchestration service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "Pillow>=11,<13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "openapi-spec-validator>=0.9,<0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
